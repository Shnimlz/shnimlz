<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
<title id="title">Shnimlz — Aprendo construyendo</title>
<desc id="desc">Terminal animada. TypeScript, Discord y desarrollo web. Proyectos actuales: DDC y Amayo.me.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10182b"/><stop offset="1" stop-color="#19142e"/></linearGradient>
 <linearGradient id="accent"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a5b4fc" stroke-opacity=".055"/></pattern>
</defs>
<style>
 text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
 .cursor{animation:blink 1.2s steps(1) infinite}
 .signal{animation:pulse 3s ease-in-out infinite}
 .bar{transform-box:fill-box;transform-origin:center bottom;animation:equalize 1.8s ease-in-out infinite alternate}
 .b2{animation-delay:-.5s}.b3{animation-delay:-1.1s}.b4{animation-delay:-.8s}
 @keyframes blink{0%,45%{opacity:1}50%,95%{opacity:0}}
 @keyframes pulse{50%{opacity:.35}}
 @keyframes equalize{0%{transform:scaleY(.35)}100%{transform:scaleY(1)}}
 @media(prefers-reduced-motion:reduce){.cursor,.signal,.bar{animation:none}}
</style>
